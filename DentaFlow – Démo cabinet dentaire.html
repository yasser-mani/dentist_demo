<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>DentaFlow – Gestion du cabinet (Démo)</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #eef3f2;
        --panel: #fff;
        --ink: #12303a;
        --mute: #5d7580;
        --line: #d6e2e1;
        --acc: #0e7c7b;
        --acc-ink: #fff;
        --soft: #dcefee;
        --t-w: #fff;
        --t-r: #e5484d;
        --t-y: #f5c518;
        --t-g: #3fae6a;
        --tooth-line: #8aa3a8;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0d1b1f;
          --panel: #14272c;
          --ink: #e6f1f0;
          --mute: #8fa9ae;
          --line: #26414780;
          --acc: #3cc4bf;
          --acc-ink: #062a2a;
          --soft: #17363a;
          --tooth-line: #5f7c82;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0d1b1f;
        --panel: #14272c;
        --ink: #e6f1f0;
        --mute: #8fa9ae;
        --line: #264147;
        --acc: #3cc4bf;
        --acc-ink: #062a2a;
        --soft: #17363a;
        --tooth-line: #5f7c82;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.5 Manrope,
          system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      .app {
        display: grid;
        grid-template-columns: 220px 1fr;
        min-height: 100vh;
      }
      aside {
            background: #225954;
    color: #e6f1f0;
    padding: 22px 16px;
    position: sticky;
    top: 0;
    height: 100vh;
      }
      aside h1 {
        font-size: 20px;
        margin: 0 0 28px;
        font-weight: 800;
        letter-spacing: -0.3px;
      }
      aside nav button {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: 0;
        color: #b9cfd2;
        padding: 10px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 500;
      }
      aside nav button.on,
      aside nav button:hover {
        background: #ffffff1c;
        color: #fff;
      }
      aside small {
        position: absolute;
        bottom: 20px;
        left: 16px;
        right: 16px;
        color: #8fa9ae;
        font-size: 12px;
      }
      main {
        padding: 28px 32px;
        max-width: 1180px;
        width: 100%;
      }
      h2 {
        font-size: 26px;
        margin: 0 0 4px;
        letter-spacing: -0.4px;
        font-weight: 800;
      }
      h3 {
        font-size: 16px;
        margin: 0 0 12px;
        font-weight: 700;
      }
      .sub {
        color: var(--mute);
        margin: 0 0 22px;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        flex-wrap: wrap;
      }
      .btn {
        background: var(--acc);
        color: var(--acc-ink);
        border: 0;
        padding: 9px 16px;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
      }
      .btn.ghost {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .btn:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      .row:focus-visible,
      g.tooth:focus-visible {
        outline: 2px solid var(--acc);
        outline-offset: 2px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 14px;
        margin-bottom: 24px;
      }
      .stat {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 16px;
      }
      .stat b {
        display: block;
        font-size: 30px;
        line-height: 1.1;
        font-weight: 800;
      }
      .stat span {
        color: var(--mute);
        font-size: 13px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 18px;
        margin-bottom: 18px;
      }
      .tools {
        display: flex;
        gap: 10px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      input,
      select,
      textarea {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 11px;
        width: 100%;
      }
      .tools input {
        max-width: 300px;
      }
      .tools select {
        width: auto;
      }
      .tbl {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 560px;
      }
      th {
        text-align: left;
        font-size: 13px;
        color: var(--mute);
        font-weight: 500;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
      }
      td {
        padding: 11px 10px;
        border-bottom: 1px solid var(--line);
      }
      .row {
        cursor: pointer;
      }
      .row:hover td {
        background: var(--soft);
      }
      .pill {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 99px;
        font-size: 12.5px;
        font-weight: 700;
        background: var(--soft);
        color: var(--acc);
      }
      .pill.tr {
        background: #f5c51830;
        color: #a67c00;
      }
      @media (prefers-color-scheme: dark) {
        .pill.tr {
          color: #f5c518;
        }
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .info dl {
        display: grid;
        grid-template-columns: 130px 1fr;
        gap: 8px 12px;
        margin: 0;
      }
      .info dt {
        color: var(--mute);
      }
      .info dd {
        margin: 0;
        font-weight: 500;
      }
      .legend {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        font-size: 13px;
        color: var(--mute);
        margin-top: 6px;
      }
      .legend i {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 1px solid var(--tooth-line);
        vertical-align: -1px;
        margin-right: 6px;
      }
      .chart {
        overflow-x: auto;
      }
      .chart svg {
        width: 100%;
        min-width: 560px;
        height: auto;
        display: block;
      }
      g.tooth {
        cursor: pointer;
      }
      g.tooth path {
        stroke: var(--tooth-line);
        stroke-width: 1.6;
        transition: fill 0.2s;
      }
      g.tooth:hover path {
        stroke: var(--acc);
        stroke-width: 2.6;
      }
      g.tooth.sel path {
        stroke: var(--acc);
        stroke-width: 3.4;
      }
      g.tooth text,
      .lbl {
        font-size: 11px;
        fill: var(--mute);
        text-anchor: middle;
        pointer-events: none;
      }
      .panel label {
        display: block;
        font-size: 13px;
        color: var(--mute);
        margin: 10px 0 3px;
      }
      .empty {
        color: var(--mute);
        padding: 20px 0;
      }
      .list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .list li {
        padding: 9px 0;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .list small {
        color: var(--mute);
      }
      .list a {
        color: var(--acc);
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
      }
      .back {
        background: none;
        border: 0;
        color: var(--acc);
        font-weight: 700;
        cursor: pointer;
        padding: 0;
        margin-bottom: 10px;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: #000a;
        display: none;
        align-items: flex-start;
        justify-content: center;
        padding: 30px 14px;
        overflow: auto;
        z-index: 9;
      }
      .modal.open {
        display: flex;
      }
      .box {
        background: var(--panel);
        border-radius: 12px;
        padding: 22px;
        width: 100%;
        max-width: 440px;
      }
      .box.wide {
        max-width: 800px;
      }
      .box label {
        display: block;
        font-size: 13px;
        color: var(--mute);
        margin: 10px 0 3px;
      }
      .acts {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 18px;
      }
      #toast {
        position: fixed;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--bg);
        padding: 10px 18px;
        border-radius: 8px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        z-index: 20;
      }
      #toast.on {
        opacity: 1;
      }
      #report {
        color: #111;
        background: #fff;
        padding: 26px;
        border-radius: 6px;
      }
      #report h2 {
        border-bottom: 2px solid #0e7c7b;
        padding-bottom: 6px;
      }
      #report table {
        min-width: 0;
        font-size: 13px;
      }
      #report th,
      #report td {
        color: #111;
        border-color: #ccc;
      }
      .hide {
        display: none !important;
      }
      @media (max-width: 820px) {
        .app {
          grid-template-columns: 1fr;
        }
        aside {
          position: static;
          height: auto;
          padding: 14px;
        }
        aside h1 {
          margin-bottom: 10px;
        }
        aside small {
          display: none;
        }
        aside nav {
          display: flex;
          gap: 6px;
        }
        aside nav button {
          width: auto;
        }
        main {
          padding: 20px 14px;
        }
        .grid2 {
          grid-template-columns: 1fr;
        }
      }
      @media print {
        body * {
          visibility: hidden;
        }
        #report,
        #report * {
          visibility: visible;
        }
        .modal {
          position: static;
          display: block;
          background: none;
          padding: 0;
        }
        #report {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside>
        <h1>DentaFlow</h1>
        <nav>
          <button class="on" data-go="dash">Tableau de bord</button>
          <button data-go="list">Patients</button>
        </nav>
        <small>Version démo · données fictives, non enregistrées</small>
      </aside>
      <main id="main"></main>
    </div>

    <div class="modal" id="mNew">
      <div class="box">
        <h3>Nouveau patient</h3>
        <label for="nNom">Nom complet</label><input id="nNom" />
        <label for="nTel">Téléphone</label
        ><input id="nTel" placeholder="06 00 00 00 00" />
        <label for="nAss">Couverture médicale</label>
        <select id="nAss">
          <option>CNSS</option>
          <option>CNOPS</option>
          <option>AMO</option>
          <option>Assurance privée</option>
          <option>Aucune</option>
        </select>
        <label for="nDate">Date du rendez-vous</label
        ><input id="nDate" type="date" />
        <label for="nEtat">État</label>
        <select id="nEtat">
          <option>Nouveau rendez-vous</option>
          <option>En traitement</option>
        </select>
        <div class="acts">
          <button class="btn ghost" data-close>Annuler</button
          ><button class="btn" id="saveNew">Enregistrer le patient</button>
        </div>
      </div>
    </div>

    <div class="modal" id="mRep">
      <div class="box wide">
        <div id="report"></div>
        <div class="acts">
          <button class="btn ghost" data-close>Fermer</button
          ><button class="btn" onclick="window.print()">
            Télécharger / Imprimer
          </button>
        </div>
      </div>
    </div>
    <div id="toast"></div>

    <script>
      const TODAY = new Date().toISOString().slice(0, 10);
      const fmt = (d) => (d ? d.split("-").reverse().join("/") : "—");
      const ST = {
        sain: ["Saine / non touchée", "var(--t-w)"],
        risque: ["Intervention nécessaire", "var(--t-r)"],
        cours: ["Traitement en cours", "var(--t-y)"],
        traite: ["Traitée, en bon état", "var(--t-g)"],
      };
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      let id = 10;
      const P = [
        {
          id: 1,
          nom: "Yasmine El Idrissi",
          tel: "06 12 34 56 78",
          ass: "CNSS",
          rdv: TODAY,
          etat: "En traitement",
          notes: ["Patiente anxieuse, prévoir des séances courtes."],
          files: [{ n: "panoramique.jpg", t: "JPG", d: "2026-09-20" }],
          teeth: {
            16: {
              s: "cours",
              tr: "Nettoyage",
              no: "Sensibilité constatée",
              d: "2026-09-28",
            },
            26: {
              s: "risque",
              tr: "Dévitalisation",
              no: "Carie profonde",
              d: "2026-09-28",
            },
            36: { s: "traite", tr: "Composite", no: "", d: "2026-08-30" },
          },
        },
        {
          id: 2,
          nom: "Omar Benjelloun",
          tel: "06 61 22 33 44",
          ass: "CNOPS",
          rdv: TODAY,
          etat: "Nouveau rendez-vous",
          notes: [],
          files: [],
          teeth: {},
        },
        {
          id: 3,
          nom: "Salma Alaoui",
          tel: "07 05 11 22 33",
          ass: "Assurance privée",
          rdv: "2026-09-30",
          etat: "En traitement",
          notes: ["Détartrage prévu le mois prochain."],
          files: [{ n: "ordonnance.pdf", t: "PDF", d: "2026-09-15" }],
          teeth: {
            11: { s: "traite", tr: "Facette", no: "", d: "2026-09-01" },
            47: {
              s: "risque",
              tr: "Extraction",
              no: "Dent de sagesse incluse",
              d: "2026-09-15",
            },
          },
        },
        {
          id: 4,
          nom: "Karim Tazi",
          tel: "06 77 88 99 00",
          ass: "Aucune",
          rdv: "2026-10-02",
          etat: "Nouveau rendez-vous",
          notes: [],
          files: [],
          teeth: {},
        },
        {
          id: 5,
          nom: "Nadia Chraibi",
          tel: "06 40 50 60 70",
          ass: "AMO",
          rdv: "2026-10-05",
          etat: "Nouveau rendez-vous",
          notes: [],
          files: [],
          teeth: {},
        },
      ];
      let view = "dash",
        cur = null,
        selT = null,
        q = "",
        flt = "";

      function go(v, pid) {
        view = v;
        cur = pid ? P.find((p) => p.id == pid) : null;
        selT = null;
        document
          .querySelectorAll("aside nav button")
          .forEach((b) =>
            b.classList.toggle(
              "on",
              b.dataset.go == (v == "profile" ? "list" : v),
            ),
          );
        render();
        scrollTo(0, 0);
      }
      function toast(t) {
        const e = document.getElementById("toast");
        e.textContent = t;
        e.classList.add("on");
        setTimeout(() => e.classList.remove("on"), 1800);
      }
      const pill = (e) =>
        `<span class="pill ${e == "En traitement" ? "tr" : ""}">${e}</span>`;

      function tableHTML() {
        const rows = P.filter(
          (p) =>
            (p.nom + p.tel).toLowerCase().includes(q.toLowerCase()) &&
            (!flt || p.etat == flt),
        );
        return `<div class="tools"><input id="q" placeholder="Rechercher un nom ou un téléphone" value="${esc(q)}" aria-label="Rechercher"><select id="f" aria-label="Filtrer par état"><option value="">Tous les états</option><option${flt == "Nouveau rendez-vous" ? " selected" : ""}>Nouveau rendez-vous</option><option${flt == "En traitement" ? " selected" : ""}>En traitement</option></select></div>
  <div class="tbl"><table><thead><tr><th>Nom</th><th>Téléphone</th><th>Rendez-vous</th><th>État</th></tr></thead><tbody>
  ${rows.map((p) => `<tr class="row" tabindex="0" data-p="${p.id}"><td><b>${esc(p.nom)}</b></td><td>${esc(p.tel)}</td><td>${fmt(p.rdv)}</td><td>${pill(p.etat)}</td></tr>`).join("") || `<tr><td colspan="4" class="empty">Aucun patient ne correspond. Modifiez la recherche ou ajoutez un patient.</td></tr>`}
  </tbody></table></div>`;
      }
      function head(t, s) {
        return `<div class="bar"><div><h2>${t}</h2><p class="sub">${s}</p></div><button class="btn" data-new>Ajouter un patient</button></div>`;
      }

      function render() {
        const m = document.getElementById("main");
        if (view == "dash") {
          const n = P.length,
            j = P.filter((p) => p.rdv == TODAY).length,
            t = P.filter((p) => p.etat == "En traitement").length,
            nw = P.filter((p) => p.etat == "Nouveau rendez-vous").length;
          m.innerHTML =
            head("Tableau de bord", "Vue d’ensemble de l’activité du cabinet") +
            `<div class="stats"><div class="stat"><b>${n}</b><span>Patients au total</span></div><div class="stat"><b>${j}</b><span>Rendez-vous aujourd’hui</span></div><div class="stat"><b>${t}</b><span>En traitement</span></div><div class="stat"><b>${nw}</b><span>Nouveaux patients</span></div></div>
    <div class="card"><h3>Patients</h3><div id="tb">${tableHTML()}</div></div>`;
        } else if (view == "list") {
          m.innerHTML =
            head("Patients", "Recherchez un patient pour ouvrir son dossier") +
            `<div class="card" id="tb">${tableHTML()}</div>`;
        } else profile(m);
        bind();
      }

      function profile(m) {
        const p = cur;
        m.innerHTML = `<button class="back" data-go="list">‹ Retour aux patients</button>
  <div class="bar"><div><h2>${esc(p.nom)}</h2><p class="sub">Dossier patient</p></div><button class="btn" id="pdf">Générer le PDF</button></div>
  <div class="card info"><h3>Informations personnelles</h3><dl>
   <dt>Nom complet</dt><dd>${esc(p.nom)}</dd><dt>Téléphone</dt><dd>${esc(p.tel)}</dd><dt>Couverture</dt><dd>${esc(p.ass)}</dd><dt>Rendez-vous</dt><dd>${fmt(p.rdv)}</dd>
   <dt>État</dt><dd><select id="etat" style="max-width:220px"><option${p.etat == "Nouveau rendez-vous" ? " selected" : ""}>Nouveau rendez-vous</option><option${p.etat == "En traitement" ? " selected" : ""}>En traitement</option></select></dd></dl></div>
  <div class="card"><h3>Informations dentaires</h3>
   <div class="grid2" style="grid-template-columns:2fr 1fr"><div><div class="chart">${chart(p)}</div>
   <div class="legend">${Object.values(ST)
     .map((v) => `<span><i style="background:${v[1]}"></i>${v[0]}</span>`)
     .join("")}</div></div>
   <div class="panel" id="tp"></div></div></div>
  <div class="grid2"><div class="card"><h3>Notes</h3><ul class="list" id="nl"></ul>
   <label class="hide" for="nn">Nouvelle note</label><textarea id="nn" rows="2" placeholder="Écrire une observation…" style="margin-top:10px"></textarea><div class="acts"><button class="btn" id="addN">Ajouter la note</button></div></div>
  <div class="card"><h3>Pièces jointes</h3><ul class="list" id="fl"></ul>
   <div style="margin-top:12px"><input type="file" id="fi" accept=".jpg,.jpeg,.png,.pdf,.doc,.docx"></div></div></div>`;
        tpanel();
        notes();
        files();
      }

      function chart(p) {
        const up = [
            18, 17, 16, 15, 14, 13, 12, 11, 21, 22, 23, 24, 25, 26, 27, 28,
          ],
          lo = [48, 47, 46, 45, 44, 43, 42, 41, 31, 32, 33, 34, 35, 36, 37, 38];
        const W = (n) => {
          const k = n % 10;
          return k >= 6 ? 36 : k >= 4 ? 28 : k == 3 ? 26 : 24;
        };
        const row = (arr, top) => {
          let x = 30,
            out = "";
          const tot = arr.reduce((a, n) => a + W(n) + 5, 0),
            off = (700 - tot) / 2;
          x = off;
          arr.forEach((n, i) => {
            const w = W(n),
              h = top ? 46 : 44,
              c = x + w / 2,
              dist = Math.abs(i - 7.5) / 7.5,
              y = top ? 60 - (1 - dist) * 0 + dist * -22 + 22 * 0 : 0;
            const yy = top
              ? 78 - dist * 0 + -1 * (1 - dist) * 0 + (1 - dist) * 0
              : 0;
            const base = top ? 130 - (1 - dist) * 0 - dist * 0 : 0;
            const Y = top ? 28 + (1 - dist) * 30 : 224 - (1 - dist) * 30;
            const s = (p.teeth[n] || { s: "sain" }).s;
            const path = top
              ? `M${x} ${Y + h - 12}Q${x} ${Y} ${x + w / 2} ${Y}Q${x + w} ${Y} ${x + w} ${Y + h - 12}Q${x + w / 2} ${Y + h + 6} ${x} ${Y + h - 12}Z`
              : `M${x} ${Y + 12}Q${x + w / 2} ${Y - 6} ${x + w} ${Y + 12}Q${x + w} ${Y + h} ${x + w / 2} ${Y + h}Q${x} ${Y + h} ${x} ${Y + 12}Z`;
            out += `<g class="tooth${selT == n ? " sel" : ""}" data-t="${n}" tabindex="0" role="button" aria-label="Dent ${n}"><path d="${path}" fill="${ST[s][1]}"/><text x="${c}" y="${top ? Y + h + 22 : Y - 8}">${n}</text></g>`;
            x += w + 5;
          });
          return out;
        };
        return `<svg viewBox="0 0 700 330" role="img" aria-label="Modèle dentaire FDI">${row(up, 1)}${row(lo, 0)}<text class="lbl" x="350" y="164">Maxillaire ↑ · ↓ Mandibule</text></svg>`;
      }

      function tpanel() {
        const e = document.getElementById("tp"),
          p = cur;
        if (!selT) {
          e.innerHTML =
            '<p class="empty">Cliquez sur une dent du modèle pour voir ou modifier son état.</p>';
          return;
        }
        const t = p.teeth[selT] || { s: "sain", tr: "", no: "", d: TODAY };
        e.innerHTML = `<h3>Dent ${selT}</h3><label for="ts">État</label><select id="ts">${Object.entries(
          ST,
        )
          .map(
            ([k, v]) =>
              `<option value="${k}"${t.s == k ? " selected" : ""}>${v[0]}</option>`,
          )
          .join("")}</select>
  <label for="tt">Traitement</label><input id="tt" value="${esc(t.tr)}" placeholder="Ex. Nettoyage">
  <label for="tn">Notes</label><textarea id="tn" rows="3">${esc(t.no)}</textarea>
  <label for="td">Date</label><input id="td" type="date" value="${t.d || TODAY}">
  <div class="acts"><button class="btn" id="tsave">Enregistrer la dent</button></div>`;
        document.getElementById("tsave").onclick = () => {
          p.teeth[selT] = {
            s: ts.value,
            tr: tt.value,
            no: tn.value,
            d: td.value,
          };
          toast("Dent " + selT + " enregistrée");
          const n = selT;
          document.querySelector(".chart").innerHTML = chart(p);
          bindTeeth();
        };
      }
      function notes() {
        const p = cur;
        document.getElementById("nl").innerHTML =
          p.notes.map((n) => `<li>${esc(n)}</li>`).join("") ||
          '<li class="empty">Aucune note pour ce patient.</li>';
      }
      function files() {
        const p = cur;
        document.getElementById("fl").innerHTML =
          p.files
            .map(
              (f) =>
                `<li><span>${esc(f.n)}<br><small>${f.t} · ajouté le ${fmt(f.d)}</small></span>${f.u ? `<a href="${f.u}" target="_blank" rel="noopener">Ouvrir</a>` : "<small>Fichier de démo</small>"}</li>`,
            )
            .join("") ||
          '<li class="empty">Aucun fichier. Ajoutez une image ou un document.</li>';
      }

      function bindTeeth() {
        document.querySelectorAll("g.tooth").forEach((g) => {
          const f = () => {
            selT = +g.dataset.t;
            document.querySelector(".chart").innerHTML = chart(cur);
            tpanel();
            bindTeeth();
          };
          g.onclick = f;
          g.onkeydown = (e) => {
            if (e.key == "Enter" || e.key == " ") {
              e.preventDefault();
              f();
            }
          };
        });
      }
      function bind() {
        document
          .querySelectorAll("[data-go]")
          .forEach((b) => (b.onclick = () => go(b.dataset.go)));
        document.querySelectorAll("[data-new]").forEach(
          (b) =>
            (b.onclick = () => {
              nDate.value = TODAY;
              mNew.classList.add("open");
            }),
        );
        document.querySelectorAll(".row").forEach((r) => {
          r.onclick = () => go("profile", r.dataset.p);
          r.onkeydown = (e) => {
            if (e.key == "Enter") go("profile", r.dataset.p);
          };
        });
        const qi = document.getElementById("q");
        if (qi) {
          qi.oninput = () => {
            q = qi.value;
            const box = document.getElementById("tb");
            const h = tableHTML();
            (view == "dash" ? box : box).innerHTML = h;
            bind();
            const n = document.getElementById("q");
            n.focus();
            n.setSelectionRange(q.length, q.length);
          };
          document.getElementById("f").onchange = (e) => {
            flt = e.target.value;
            document.getElementById("tb").innerHTML = tableHTML();
            bind();
          };
        }
        if (view == "profile") {
          bindTeeth();
          etat.onchange = () => {
            cur.etat = etat.value;
            toast("État mis à jour");
          };
          addN.onclick = () => {
            if (!nn.value.trim()) return;
            cur.notes.unshift(nn.value.trim());
            nn.value = "";
            notes();
            toast("Note ajoutée");
          };
          fi.onchange = () => {
            const f = fi.files[0];
            if (!f) return;
            const ext = f.name.split(".").pop().toUpperCase();
            cur.files.unshift({
              n: f.name,
              t: ext,
              d: TODAY,
              u: URL.createObjectURL(f),
            });
            files();
            fi.value = "";
            toast("Fichier ajouté");
          };
          pdf.onclick = report;
        }
      }
      function report() {
        const p = cur,
          td = Object.entries(p.teeth).filter(([, t]) => t.s != "sain");
        report_.innerHTML;
      }
      const report_ = document.getElementById("report");
      report = function () {
        const p = cur,
          td = Object.entries(p.teeth).filter(([, t]) => t.s != "sain");
        report_.innerHTML = `<h2>Rapport patient – ${esc(p.nom)}</h2><p>Édité le ${fmt(TODAY)}</p>
  <h3>Informations du patient</h3><p>Téléphone : ${esc(p.tel)}<br>Couverture : ${esc(p.ass)}<br>Rendez-vous : ${fmt(p.rdv)}<br>État : ${p.etat}</p>
  <h3>Modèle dentaire</h3><div style="max-width:560px">${chart(p).replace(/ tabindex="0" role="button"/g, "")}</div>
  <table><thead><tr><th>Dent</th><th>État</th><th>Traitement</th><th>Notes</th><th>Date</th></tr></thead><tbody>${td.map(([n, t]) => `<tr><td>${n}</td><td>${ST[t.s][0]}</td><td>${esc(t.tr)}</td><td>${esc(t.no)}</td><td>${fmt(t.d)}</td></tr>`).join("") || '<tr><td colspan="5">Aucune dent à signaler.</td></tr>'}</tbody></table>
  <h3>Notes générales</h3>${p.notes.map((n) => `<p>• ${esc(n)}</p>`).join("") || "<p>Aucune note.</p>"}
  <h3>Pièces jointes</h3>${p.files.map((f) => `<p>• ${esc(f.n)} (${f.t})</p>`).join("") || "<p>Aucune pièce jointe.</p>"}`;
        mRep.classList.add("open");
      };
      document
        .querySelectorAll("[data-close]")
        .forEach(
          (b) =>
            (b.onclick = () => b.closest(".modal").classList.remove("open")),
        );
      saveNew.onclick = () => {
        if (!nNom.value.trim()) {
          nNom.focus();
          toast("Saisissez le nom du patient");
          return;
        }
        P.unshift({
          id: id++,
          nom: nNom.value.trim(),
          tel: nTel.value || "—",
          ass: nAss.value,
          rdv: nDate.value,
          etat: nEtat.value,
          notes: [],
          files: [],
          teeth: {},
        });
        nNom.value = nTel.value = "";
        mNew.classList.remove("open");
        toast("Patient enregistré");
        render();
      };
      render();
    </script>
  </body>
</html>
